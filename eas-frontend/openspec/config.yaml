schema: spec-driven

context: |
  Project: storefront web app for the AI e-commerce assistant ("describe what you want, we find the best match").
  Separate project in the `eas-frontend/` directory of the ecom-assistant repository; the Spring Boot backend is the sibling
  project `../eas-backend` with its own OpenSpec root (`../eas-backend/openspec`). Backend specs are the source of truth for the API contract,
  in particular `storefront-search-api` (product representation, interpretation) and `query-analysis-guardrail` (422 rejection).
  Tech stack: Vite, React, TypeScript (strict), Tailwind CSS, system Georgia/Arial font stacks, npm, Vitest + React Testing Library + MSW,
  Playwright for end-to-end tests with a mocked backend, ESLint. Client-only SPA built to static files, served from S3 behind
  CloudFront; the API is called on the same origin under `/api/v1`.
  Look and feel: premium minimal fashion shop (lots of white space, soft Sage palette, serif display type, sans body type, transparent graphite garment illustrations).
  Interface language: English only; prices in EUR. The customer may type search requests in any language.
