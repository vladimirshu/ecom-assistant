spring:
  application:
    name: ecom-assistant

  # AI Configuration
  ai:
    openai:
      embedding:
        options:
          model: text-embedding-3-small
      api-key: ${OPEN_AI_TOKEN}
      chat:
        options:
          model: gpt-4o-mini
    vectorstore:
      qdrant:
        collection-name: "products"
        host: ${QDRANT_HOST:localhost}
        port: ${QDRANT_PORT:6334}
        initialize-schema: true

#    ollama:
#      chat:
#        options:
#          model: qwen3:latest



# Application Configuration
ecom:
  search:
    top-k: 30
    max-results: 10
    similarity-threshold: 0.15
  memory:
    inactivity-timeout: 24h
    cleanup-interval: 1h
  import:
    sample-file: sampledata/apparel_jackets_sample.csv
  assets:
    base-url: ${ECOM_ASSETS_BASE_URL:/images/}

logging:
  level:
    org:
      springframework:
        ai: DEBUG
    com:
      ecomassistant: DEBUG

# Actuator: expose only the health endpoint under the public API base path.
# Readiness (startup runners finished + vector store reachable) is reported by the
# QdrantHealthIndicator and ReadinessHealthIndicator beans; the response body carries
# only the aggregate `status` field (`UP`/`DOWN`).
#
# The built-in availability probes are disabled: their readiness state reports
# `OUT_OF_SERVICE` (not `DOWN`) and would add a `groups` field to the body, while the
# contract requires a bare `status` of `UP` or `DOWN`.
management:
  endpoints:
    web:
      base-path: /api/v1
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: false