spring:
  application:
    name: ecom-assistant

  # AI Configuration
  ai:
    openai:
      embedding:
        options:
          model: text-embedding-3-small
      api-key: ${OPEN_AI_TOKEN}
      chat:
        options:
          model: gpt-4o-mini
    vectorstore:
      qdrant:
        collection-name: "products"
        host: ${QDRANT_HOST:localhost}
        port: ${QDRANT_PORT:6334}
        initialize-schema: true

#    ollama:
#      chat:
#        options:
#          model: qwen3:latest



# Application Configuration
ecom:
  search:
    top-k: 30
    max-results: 10
    similarity-threshold: 0.15
  import:
    sample-file: sampledata/apparel_jackets_sample.csv
  assets:
    base-url: ${ECOM_ASSETS_BASE_URL:/images/}

logging:
  level:
    org:
      springframework:
        ai: DEBUG
    com:
      ecomassistant: DEBUG