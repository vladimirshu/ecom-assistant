openapi: 3.0.3
info:
  title: E-Commerce Assistant API
  version: 0.0.1-SNAPSHOT
  description: |
    AI-powered e-commerce assistant that lets customers search and explore a
    product catalog (apparel / jackets) using natural language questions, e.g.
    *"Show me a red waterproof jacket under €100"*.

    The assistant combines semantic search (Qdrant vector store + OpenAI
    embeddings) with AI-based interpretation of the user's request, a
    clarification loop for ambiguous or incomplete queries, negative-example
    filtering, price filtering and optional lowest-price ordering.

    Notes:
    * There is no authentication — every request is permitted (`permitAll`).
    * The product catalog is imported from a CSV file at application startup;
      there is no upload endpoint yet.
    * HTTP 200 responses carry `products` (search results). Requests the
      assistant judges irrelevant, confusing or contradictory are rejected with
      HTTP 422 and a body carrying `suggestedPrompts`.

  contact:
    name: E-Commerce Assistant Team

servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: Search
    description: Natural-language product search
  - name: Health
    description: Application readiness

paths:
  /api/v1/search:
    get:
      tags:
        - Search
      summary: Search the product catalog using natural language
      description: |
        Interprets the user's natural-language message with an LLM, extracts
        search intent, negative examples and price constraints, then runs a
        semantic (vector) search against the product catalog.

        If the message is irrelevant to apparel search, confusing or
        contradictory, the request is rejected with HTTP 422 and the body
        carries `suggestedPrompts` so the client can ask the user to rephrase.
      operationId: findProducts
      parameters:
        - name: message
          in: query
          required: true
          description: |
            The user's natural-language search request (for example
            `Show me a red waterproof jacket under 100 euro`).

            Validation (applied after Unicode NFKC normalization, trimming and
            collapsing of repeated whitespace):
            * 3 to 500 characters long.
            * Only letters and combining marks of any script, digits,
              whitespace and the characters `' ’ " - _ . , ! ? ( ) € $ £ ¥ % / & +`.
            * Angle brackets and other characters are rejected with HTTP 400.
          schema:
            type: string
            minLength: 3
            maxLength: 500
          example: Show me a red waterproof jacket under 100 euro
        - name: conversationId
          in: query
          required: true
          description: |
            Client-generated conversation token (a random UUID, e.g. from
            `crypto.randomUUID()`, is recommended). The assistant keeps
            multi-turn context per token (e.g. "show me the same jacket but in
            blue"); a token it has not seen starts an empty conversation. History
            expires after 24 hours without a new turn and is held in backend
            process memory only (lost on restart, not shared between instances).
            Must be 1 to 50 characters and contain only ASCII letters, digits,
            `-` and `_`.
          schema:
            type: string
            minLength: 1
            maxLength: 50
            pattern: '^[a-zA-Z0-9_-]+$'
          example: session_42-a
        - name: clearMemory
          in: query
          required: false
          description: |
            When `true`, the assistant forgets the conversation history for the
            given `conversationId` (and only that conversation) before processing
            the message.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Successful search.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
              examples:
                searchResults:
                  summary: Products found
                  value:
                    products:
                      - sku: JKT0001
                        title: Metro Commuter Rain Jacket
                        category: Rain Jackets
                        colors: [navy, red]
                        sizes: [XS, S, M]
                        price: 262.73
                        description: Urban explorer jacket crafted from water-resistant nylon, lightweight and durable.
                        imageUrl: /images/categories/rain.webp
                    interpretation:
                      searchQuery: blue cotton jacket
                      negativeExamples: [wool]
                      priceConstraint:
                        operator: LESS_THAN
                        value: 200
                      sortByLowestPrice: false
                    suggestedPrompts: null
        '400':
          description: |
            Bad request. Returned either for input validation failures (the body
            maps each invalid field to its error message) or for an invalid
            argument (the body has `error` and `message`).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationError'
                  - $ref: '#/components/schemas/ApiError'
              examples:
                invalidMessage:
                  summary: Invalid message
                  value:
                    message: Message must be 3 to 500 characters and contain only letters, digits, spaces and basic punctuation
                missingConversationId:
                  summary: Missing or empty conversation id
                  value:
                    conversationId: Conversation ID cannot be blank
                invalidConversationId:
                  summary: Invalid conversation id
                  value:
                    conversationId: Conversation ID can only contain alphanumeric characters, hyphens, and underscores
                illegalArgument:
                  summary: Illegal argument
                  value:
                    error: Invalid argument
                    message: price is not a valid number
        '422':
          description: |
            The request was rejected by query analysis as irrelevant to apparel
            search, confusing or contradictory. `products` is `null` and
            `suggestedPrompts` holds 1 to 5 prompts the user could send instead.
            This replaces the former HTTP 200 clarification response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
              example:
                products: null
                interpretation: null
                suggestedPrompts:
                  - a light summer jacket
                  - a warm winter jacket
        '500':
          description: |
            Internal server error. Returned when the LLM produced an invalid
            query analysis: not matching the expected schema after retries,
            a blank or too long search query, text containing control
            characters, too many suggested prompts or negative examples, or a
            non-positive price.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error: Illegal assistant response
                message: Assistant response must not be blank

  /api/v1/health:
    get:
      tags:
        - Health
      summary: Readiness probe
      description: |
        Reports whether the application is ready to serve searches. Returns HTTP 200
        with `{"status":"UP"}` only when all startup runners have completed (including
        the catalog import and the price index creation) and the vector store is
        reachable; otherwise HTTP 503 with `{"status":"DOWN"}`.

        The probe makes no LLM or embedding call and exposes no component details,
        versions or configuration, so it is safe to poll frequently.
      operationId: health
      responses:
        '200':
          description: The application is ready to serve searches.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              example:
                status: UP
        '503':
          description: |
            The application is not ready: startup runners have not finished or the
            vector store is unreachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              example:
                status: DOWN

components:
  schemas:
    HealthStatus:
      type: object
      description: Readiness status. The body carries only the `status` property.
      required:
        - status
      properties:
        status:
          type: string
          enum: [UP, DOWN]
          description: Whether the application is ready to serve searches.
    Product:
      type: object
      description: A product from the apparel catalog.
      required:
        - sku
        - title
        - category
        - colors
        - sizes
        - price
        - description
        - imageUrl
      properties:
        sku:
          type: string
          description: Unique stock-keeping unit (SKU) identifier.
          example: JKT0001
        title:
          type: string
          description: Human-readable product title.
          example: Metro Commuter Rain Jacket
        category:
          type: string
          description: Category name of the product.
          example: Rain Jackets
        colors:
          type: array
          description: Available colors, in catalog order.
          items:
            type: string
          example: [navy, red]
        sizes:
          type: array
          description: Available sizes in canonical order (XXS..XXXL), unknown sizes last.
          items:
            type: string
          example: [XS, S, M]
        price:
          type: number
          format: double
          nullable: true
          description: Product price in EUR.
          example: 262.73
        description:
          type: string
          description: Product description used as the semantic search content.
          example: Urban explorer jacket crafted from water-resistant nylon, lightweight and durable.
        imageUrl:
          type: string
          description: Public URL of the product image, resolved from the configured assets base URL and the image key.
          example: /images/categories/rain.webp

    Interpretation:
      type: object
      description: |
        The system's interpretation of a successful search request, derived from the
        validated query analysis.
      required:
        - searchQuery
        - negativeExamples
        - sortByLowestPrice
      properties:
        searchQuery:
          type: string
          description: The compressed English search query, with negatives and price removed.
          example: blue cotton jacket
        negativeExamples:
          type: array
          description: Negative examples excluded from the search. Empty when there are none.
          items:
            type: string
          example: [wool]
        priceConstraint:
          type: object
          nullable: true
          description: The price constraint, or null when there is none.
          required:
            - operator
            - value
          properties:
            operator:
              type: string
              enum: [LESS_THAN, LESS_THAN_OR_EQUAL, GREATER_THAN, GREATER_THAN_OR_EQUAL]
            value:
              type: number
              example: 200
        sortByLowestPrice:
          type: boolean
          description: Whether results are ordered by ascending price.
          example: false

    ChatResponse:
      type: object
      description: |
        Result of a search request. On HTTP 200 `products` and `interpretation` are
        populated and `suggestedPrompts` is `null`; on HTTP 422 `products` and
        `interpretation` are `null` and `suggestedPrompts` is populated.
      properties:
        products:
          type: array
          nullable: true
          description: |
            Matching products, ordered by relevance (or ascending price when the
            request asked for the lowest price). `null` when the request was
            rejected (HTTP 422).
          items:
            $ref: '#/components/schemas/Product'
        interpretation:
          $ref: '#/components/schemas/Interpretation'
          nullable: true
        suggestedPrompts:
          type: array
          nullable: true
          description: |
            Rephrasing suggestions returned with HTTP 422 when the request was
            rejected as irrelevant, confusing or contradictory. `null` when
            products were returned instead.
          items:
            type: string

    ValidationError:
      type: object
      description: |
        Validation failure body. Maps each invalid request field name to its
        human-readable error message. The set of keys is dynamic.
      additionalProperties:
        type: string
      example:
        message: Message must be 3 to 500 characters and contain only letters, digits, spaces and basic punctuation

    ApiError:
      type: object
      description: Generic error body used for invalid arguments and internal errors.
      properties:
        error:
          type: string
          description: Short, stable error category.
          example: Invalid argument
        message:
          type: string
          description: Human-readable error detail.
          example: price is not a valid number
